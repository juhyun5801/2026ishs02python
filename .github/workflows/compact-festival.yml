name: Add compact festival download

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify and add compact download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 festival_raibit/scripts/compact-release.py
